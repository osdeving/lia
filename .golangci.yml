run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  disable-all: true
  enable:
    # Core (stable, minimal)
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Style & Formatting
    - gofmt
    - goimports
    - misspell

linters-settings:
  govet:
    enable:
      - shadow
  goimports:
    local-prefixes: github.com/willams/lia

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
