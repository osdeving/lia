run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  disable-all: true
  enable:
    # Core
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - typecheck

    # Style & Formatting
    - gofmt
    - goimports
    - misspell
    - revive
    - whitespace

    # Security & Bugs
    - gosec
    - gocritic
    - bodyclose
    - noctx

    # Performance
    - prealloc

    # Code Quality
    - unparam
    - nakedret
    - dogsled
    - nolintlint

linters-settings:
  govet:
    enable:
      - shadow
  goimports:
    local-prefixes: github.com/willams/lia
  gocritic:
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style
    disabled-checks:
      - dupImport # handled by goimports
      - ifElseChain
      - octalLiteral
      - whyNoLint
      - wrapperFunc
  revive:
    rules:
      - name: exported
        arguments:
          - disableStuttering: true
      - name: package-comments
      - name: error-naming
      - name: error-strings
      - name: error-return
      - name: var-naming
      - name: receiver-naming
  gosec:
    excludes:
      - G104 # duplicate of errcheck

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - noctx
